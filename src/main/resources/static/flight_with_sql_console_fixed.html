<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>🛫 Flight Cache Viewer</title>
<link href="https://cdn.jsdelivr.net/npm/@picocss/pico@latest/css/pico.min.css" rel="stylesheet"/>
</head>
<body>
<main class="container">
<h1>🛫 Flight Cache Viewer</h1>
<label for="ticketSelect">Ticket seç:</label>
<select id="ticketSelect"></select>
<div class="grid" style="margin-top: 1em; margin-bottom: 1.5em;">
<button id="editBtn">📝 Düzenle</button>
<button class="secondary" id="deleteBtn">🗑️ Sil</button>
</div>
<div class="grid">
<button id="openDataDialogBtn">Veriyi Getir</button>
<button class="secondary" id="refreshBtn">Cache Yenile</button>
<button class="outline" id="openDialogBtn">➕ Yeni Ticket</button>
</div>
<div id="ttlDisplay" style="margin-top: 1em;"></div>
<dialog id="addTicketDialog">
<article>
<header>
<strong id="dialogTitle">Yeni Ticket Ekle</strong>
</header>
<form id="addTicketForm">
<input id="ticketName" placeholder="Ticket adı" required="" type="text"/>
<input id="sqlQuery" placeholder="SQL sorgusu" required="" type="text"/>
<input id="ttl" min="1" placeholder="TTL (dakika)" required="" type="number" value="5"/>
<select id="dbType" required="">
<option value="">Veritabanı Tipi</option>
<option>PostgreSQL</option>
<option>MySQL</option>
<option>Oracle</option>
</select>
<input id="host" placeholder="Host" required="" type="text"/>
<input id="port" placeholder="Port" required="" type="number"/>
<input id="dbName" placeholder="Veritabanı Adı" required="" type="text"/>
<input id="user" placeholder="Kullanıcı Adı" required="" type="text"/>
<input id="password" placeholder="Şifre" required="" type="password"/>
<footer style="margin-top: 1em;">
<button class="primary" id="submitBtn" type="submit">Ekle</button>
<button class="secondary" id="closeDialogBtn" type="button">İptal</button>
</footer>
</form>
</article>
</dialog>
<dialog id="dataDialog">
<article style="width: 100%; max-width: none;">
<header>
<strong>📊 Veri Görüntüleme</strong>
</header>
<div class="grid">
<button class="contrast" id="csvPageBtn">Bu Sayfayı CSV</button>
<button class="contrast" id="csvAllBtn">Tüm Kayıtları CSV</button>
<button class="secondary" id="closeDataDialogBtn">Kapat</button>
</div>
<!-- 🆕 Filtre input -->
<input id="filterInput" placeholder="Filtre (örn. ad, ID vs.)" style="width: 100%; margin-top: 1em;" type="text"/>
<div id="tableContainer" style="margin-top: 1em;"></div>
<div id="pagination" style="margin-top: 1em; text-align: center;"></div>
</article>
</dialog>
<script>
document.addEventListener("DOMContentLoaded", () => {
let currentRows = [];
        let currentPage = 0;
        let totalPages = 0;
        const pageSize = 100;
        let formMode = 'add';
        let editingTicket = null;

        async function fetchTickets() {
          console.log("🎯 Ticket listesi yükleniyor...");
          const res = await fetch('/tickets');
          const tickets = await res.json();
          console.log("📦 Gelen tickets:", tickets);
          const select = document.getElementById('ticketSelect');
          select.innerHTML = tickets.map(t => `<option value="${t}">${t}</option>`).join('');
        }

function renderPagination() {
  const container = document.getElementById('pagination');
  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  let html = `<nav><ul class="pagination">`;

  // ⏮ İlk sayfa
  html += `<li><button ${currentPage === 0 ? 'disabled' : ''} onclick="fetchData(0)">⏮</button></li>`;

  // ← Önceki
  html += `<li><button ${currentPage === 0 ? 'disabled' : ''} onclick="fetchData(${currentPage - 1})">←</button></li>`;

  const maxButtons = 5;
  const start = Math.max(0, Math.min(currentPage - 2, totalPages - maxButtons));
  const end = Math.min(totalPages, start + maxButtons);

  for (let i = start; i < end; i++) {
    html += `<li><button ${i === currentPage ? 'class=contrast' : ''} onclick="fetchData(${i})">${i + 1}</button></li>`;
  }

  // → Sonraki
  html += `<li><button ${currentPage === totalPages - 1 ? 'disabled' : ''} onclick="fetchData(${currentPage + 1})">→</button></li>`;

  // ⏭ Son sayfa
  html += `<li><button ${currentPage === totalPages - 1 ? 'disabled' : ''} onclick="fetchData(${totalPages - 1})">⏭</button></li>`;

  html += `</ul></nav>`;

  container.innerHTML = html;
}

    async function fetchData(page = 0) {
      const ticket = document.getElementById('ticketSelect').value;
      if (!ticket) return;

      const filter = document.getElementById('filterInput').value.trim();
      const filterParam = filter ? `&filter=${encodeURIComponent(filter)}` : '';

      const res = await fetch(`/data?ticket=${ticket}&page=${page}&size=${pageSize}${filterParam}`);
      const data = await res.json();
      const rows = data.rows ?? [];
      currentRows = rows;
      currentPage = page;
      totalPages = Math.ceil((data.total ?? 0) / pageSize);

      renderTable(rows);
      renderPagination();
    }

document.getElementById('filterInput').addEventListener('input', () => {
  fetchData(0);
});

        function renderTable(rows) {
          const tableDiv = document.getElementById('tableContainer');
          if (rows.length === 0) {
            tableDiv.innerHTML = '<p>Veri yok</p>';
            return;
          }

          const headers = Object.keys(rows[0]);
          const headerRow = headers.map(h => `<th>${h}</th>`).join('');
          const bodyRows = rows.map(r =>
            `<tr>${headers.map(h => `<td>${r[h]}</td>`).join('')}</tr>`
          ).join('');

          tableDiv.innerHTML = `
            <table>
              <thead><tr>${headerRow}</tr></thead>
              <tbody>${bodyRows}</tbody>
            </table>
          `;
        }

        function downloadCSV(rows, filename = 'data.csv') {
          if (!rows || rows.length === 0) return;
          const headers = Object.keys(rows[0]);
          const csv = [headers.join(',')].concat(
            rows.map(r => headers.map(h => `"${r[h]}"`).join(','))
          ).join('\n');

          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          link.click();
        }

        async function downloadAllCSV() {
          const ticket = document.getElementById('ticketSelect').value;
          if (!ticket) return;

          const res = await fetch(`/data?ticket=${ticket}&page=0&size=1000000`);
          const data = await res.json();
          const rows = data.rows ?? [];
          downloadCSV(rows, `${ticket}-all.csv`);
        }

        document.getElementById('editBtn').addEventListener('click', () => {
            const ticket = document.getElementById('ticketSelect').value;
            if (!ticket) return;

            fetch(`/metadata?ticket=${ticket}`)
                .then(res => res.json())
                .then(data => {
                    formMode = 'edit';
                    editingTicket = ticket;

                    document.getElementById('ticketName').value = data.ticket;
                    document.getElementById('ticketName').setAttribute('readonly', true);
                    document.getElementById('sqlQuery').value = data.sql;
                    document.getElementById('ttl').value = data.ttlMinutes;
                    document.getElementById('dbType').value = data.dbType;
                    document.getElementById('host').value = data.host;
                    document.getElementById('port').value = data.port;
                    document.getElementById('dbName').value = data.dbName;
                    document.getElementById('user').value = data.user;
                    document.getElementById('password').value = data.password;

                    document.getElementById('dialogTitle').textContent = "Ticket Güncelle";
                    document.getElementById('submitBtn').textContent = "Kaydet";
                    document.getElementById('addTicketDialog').showModal();
                });
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            const ticket = document.getElementById('ticketSelect').value;
            if (!ticket) return;

            if (!confirm(`'${ticket}' ticket'ını silmek istediğinizden emin misiniz?`)) return;

            const res = await fetch(`/delete-ticket?ticket=${ticket}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                alert("✅ Ticket başarıyla silindi.");
                fetchTickets(); // listeyi yenile
            } else {
                alert("❌ Silme işlemi başarısız!");
            }
        });

        document.getElementById('addTicketForm').addEventListener('submit', async (e) => {
          e.preventDefault();

          const payload = {
            ticket: document.getElementById('ticketName').value,
            sql: document.getElementById('sqlQuery').value,
            ttl: parseInt(document.getElementById('ttl').value),
            dbType: document.getElementById('dbType').value,
            host: document.getElementById('host').value,
            port: parseInt(document.getElementById('port').value),
            dbName: document.getElementById('dbName').value,
            user: document.getElementById('user').value,
            password: document.getElementById('password').value
          };

          const res = await fetch(`/add-ticket`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            alert('✅ Ticket başarıyla eklendi!');
            fetchTickets();
            document.getElementById('addTicketDialog').close();
          } else {
            alert('❌ Ticket eklenemedi!');
          }
        });

        document.getElementById('openDialogBtn').addEventListener('click', () => {
            formMode = 'add';
            editingTicket = null;
            document.getElementById('addTicketForm').reset();
            document.getElementById('ticketName').removeAttribute('readonly');
            document.getElementById('dialogTitle').textContent = "Yeni Ticket Ekle";
            document.getElementById('submitBtn').textContent = "Ekle";
            document.getElementById('addTicketDialog').showModal();
        });

        document.getElementById('closeDialogBtn').addEventListener('click', () => {
          document.getElementById('addTicketDialog').close();
        });

        document.getElementById('openDataDialogBtn').addEventListener('click', async () => {
          await fetchData(0);
          document.getElementById('dataDialog').showModal();
        });

        document.getElementById('closeDataDialogBtn').addEventListener('click', () => {
          document.getElementById('dataDialog').close();
        });

        document.getElementById('csvPageBtn').addEventListener('click', () => downloadCSV(currentRows, 'page.csv'));
        document.getElementById('csvAllBtn').addEventListener('click', downloadAllCSV);

        fetchTickets();
    
document.getElementById("runSqlBtn").addEventListener("click", async () => {
    const sql = document.getElementById("sqlInput").value.trim();
    const resultDiv = document.getElementById("sqlResult");
    const errorDiv = document.getElementById("sqlError");

    resultDiv.innerHTML = "";
    errorDiv.textContent = "";

    if (!sql.toLowerCase().startsWith("select")) {
        errorDiv.textContent = "Sadece SELECT sorguları desteklenmektedir.";
        return;
    }

    try {
        const res = await fetch("/sql-query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sql })
        });

        if (!res.ok) {
            const err = await res.text();
            errorDiv.textContent = "⚠️ Hata: " + err;
            return;
        }

        const data = await res.json();
        if (!data.length) {
            resultDiv.innerHTML = "<em>Sonuç bulunamadı.</em>";
            return;
        }

        const table = document.createElement("table");
        const thead = table.createTHead();
        const headerRow = thead.insertRow();
        Object.keys(data[0]).forEach(key => {
            const th = document.createElement("th");
            th.textContent = key;
            headerRow.appendChild(th);
        });

        const tbody = table.createTBody();
        data.forEach(row => {
            const tr = tbody.insertRow();
            Object.values(row).forEach(value => {
                const td = tr.insertCell();
                td.textContent = value;
            });
        });

        resultDiv.appendChild(table);
    } catch (e) {
        errorDiv.textContent = "❌ Beklenmeyen hata: " + e.message;
    }
});
});
</script>
<section style="margin-top: 2em;">
<h3>🧪 SQL Konsolu</h3>
<textarea id="sqlInput" placeholder="SELECT * FROM myTicket WHERE age &gt; 30" rows="4" style="width: 100%;"></textarea>
<button class="primary" id="runSqlBtn" style="margin-top: 0.5em;">Sorguyu Çalıştır</button>
<div id="sqlError" style="color: red; margin-top: 1em;"></div>
<div id="sqlResult" style="margin-top: 1em;"></div>
</section>
</main></body>
</html>
