<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🛫 Flight Cache Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@latest/css/pico.min.css">
</head>
<body>
<main class="container">
    <h1>🛫 Flight Cache Viewer</h1>

    <label for="ticketSelect">Ticket seç:</label>
    <select id="ticketSelect"></select>

    <div class="grid">
        <button id="fetchBtn">Veriyi Getir</button>
        <button id="refreshBtn" class="secondary">Cache Yenile</button>
        <button id="csvPageBtn" class="contrast">Bu Sayfayı CSV</button>
        <button id="csvAllBtn" class="contrast">Tüm Kayıtları CSV</button>
        <button id="openDialogBtn" class="outline">➕ Yeni Ticket</button>
    </div>

    <div id="ttlDisplay" style="margin-top: 1em;"></div>
    <div id="tableContainer" style="margin-top: 2em;"></div>
    <div id="pagination" style="margin-top: 2em; text-align: center;"></div>
</main>

<dialog id="addTicketDialog">
    <article>
        <header>
            <strong>Yeni Ticket Ekle</strong>
        </header>
        <form id="addTicketForm">
            <input type="text" id="ticketName" placeholder="Ticket adı" required />
            <input type="text" id="sqlQuery" placeholder="SQL sorgusu" required />
            <select id="dbType" required>
                <option value="">Veritabanı Tipi</option>
                <option>PostgreSQL</option>
                <option>MySQL</option>
                <option>Oracle</option>
            </select>

            <input type="text" id="host" placeholder="Host" required />
            <input type="number" id="port" placeholder="Port" required />
            <input type="text" id="dbName" placeholder="Veritabanı Adı" required />
            <input type="text" id="user" placeholder="Kullanıcı Adı" required />
            <input type="password" id="password" placeholder="Şifre" required />
            <input type="number" id="ttl" placeholder="TTL (dakika)" required />
            <footer style="margin-top: 1em;">
                <button type="submit" class="primary">Ekle</button>
                <button type="button" id="closeDialogBtn" class="secondary">İptal</button>
            </footer>
        </form>
    </article>
</dialog>

<script>
    let currentRows = [];
    let currentPage = 0;
    let totalPages = 0;
    const pageSize = 100;

    async function fetchTickets() {
        const res = await fetch('/tickets');
        const tickets = await res.json();
        const select = document.getElementById('ticketSelect');
        select.innerHTML = tickets.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    async function fetchTTL(ticket) {
        const res = await fetch('/cache-info');
        const data = await res.json();
        const ttlInfo = data[ticket];
        if (ttlInfo && ttlInfo.expiresIn !== undefined) {
            const ttlSeconds = Math.floor(ttlInfo.expiresIn / 1000);
            let color = 'green';
            if (ttlSeconds < 60) color = 'red';
            else if (ttlSeconds < 180) color = 'goldenrod';

            document.getElementById('ttlDisplay').innerHTML =
                `<strong>TTL:</strong> <span style="color: ${color}">${ttlSeconds}s</span>`;
        }
    }

    async function fetchData(page = 0) {
        const ticket = document.getElementById('ticketSelect').value;
        if (!ticket) return;

        await fetchTTL(ticket);

        const res = await fetch(`/data?ticket=${ticket}&page=${page}&size=${pageSize}`);
        const data = await res.json();
        const rows = data.rows ?? [];
        currentRows = rows;
        currentPage = page;
        totalPages = Math.ceil((data.total ?? 0) / pageSize);

        renderTable(rows);
        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = `<nav><ul class="pagination">`;
        html += `<li><button ${currentPage === 0 ? 'disabled' : ''} onclick="fetchData(${currentPage - 1})">←</button></li>`;

        const maxButtons = 5;
        const start = Math.max(0, Math.min(currentPage - 2, totalPages - maxButtons));
        const end = Math.min(totalPages, start + maxButtons);

        for (let i = start; i < end; i++) {
            html += `<li><button ${i === currentPage ? 'class=contrast' : ''} onclick="fetchData(${i})">${i + 1}</button></li>`;
        }

        html += `<li><button ${currentPage === totalPages - 1 ? 'disabled' : ''} onclick="fetchData(${currentPage + 1})">→</button></li>`;
        html += `</ul></nav>`;

        container.innerHTML = html;
    }


    async function refreshCache() {
        const ticket = document.getElementById('ticketSelect').value;
        if (!ticket) return;

        const res = await fetch(`/refresh?ticket=${ticket}`);
        const result = await res.text();
        alert(`Cache sonucu: ${result}`);

        await fetchData(0);
    }

    function renderTable(rows) {
        const tableDiv = document.getElementById('tableContainer');
        if (rows.length === 0) {
            tableDiv.innerHTML = '<p>Veri yok</p>';
            return;
        }

        const headers = Object.keys(rows[0]);
        const headerRow = headers.map(h => `<th>${h}</th>`).join('');
        const bodyRows = rows.map(r =>
            `<tr>${headers.map(h => `<td>${r[h]}</td>`).join('')}</tr>`
        ).join('');

        tableDiv.innerHTML = `
        <table>
          <thead><tr>${headerRow}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      `;
    }

    function downloadCSV(rows, filename = 'data.csv') {
        if (!rows || rows.length === 0) return;
        const headers = Object.keys(rows[0]);
        const csv = [headers.join(',')].concat(
            rows.map(r => headers.map(h => `"${r[h]}"`).join(','))
        ).join('\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
    }

    async function downloadAllCSV() {
        const ticket = document.getElementById('ticketSelect').value;
        if (!ticket) return;

        const res = await fetch(`/data?ticket=${ticket}&page=0&size=1000000`);
        const data = await res.json();
        const rows = data.rows ?? [];
        downloadCSV(rows, `${ticket}-all.csv`);
    }

    document.getElementById('fetchBtn').addEventListener('click', () => fetchData(0));
    document.getElementById('refreshBtn').addEventListener('click', refreshCache);
    document.getElementById('csvPageBtn').addEventListener('click', () => downloadCSV(currentRows, 'page.csv'));
    document.getElementById('csvAllBtn').addEventListener('click', downloadAllCSV);

    const dialog = document.getElementById('addTicketDialog');
    document.getElementById('openDialogBtn').addEventListener('click', () => {
        document.getElementById('addTicketForm').reset(); // tüm alanları sıfırlar
        document.getElementById('addTicketDialog').showModal();
    });
    document.getElementById('closeDialogBtn').addEventListener('click', () => dialog.close());

    document.getElementById('addTicketForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            ticket: document.getElementById('ticketName').value,
            sql: document.getElementById('sqlQuery').value,
            ttl: parseInt(document.getElementById('ttl').value),
            dbType: document.getElementById('dbType').value,
            host: document.getElementById('host').value,
            port: parseInt(document.getElementById('port').value),
            dbName: document.getElementById('dbName').value,
            user: document.getElementById('user').value,
            password: document.getElementById('password').value
        };

        const res = await fetch(`/add-ticket`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('✅ Ticket başarıyla eklendi!');
            fetchTickets();
            document.getElementById('addTicketDialog').close();
        } else {
            alert('❌ Ticket eklenemedi!');
        }
    });

    document.getElementById('openDialogBtn').addEventListener('click', () => {
        document.getElementById('addTicketDialog').showModal();
    });

    document.getElementById('closeDialogBtn').addEventListener('click', () => {
        document.getElementById('addTicketDialog').close();
    });

    fetchTickets();
</script>
</body>
</html>
